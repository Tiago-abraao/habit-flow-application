<section class="metrics-grid">

    <div class="metric-card">
        <div class="metric-icon">
            <i class="fa-solid fa-list-check"></i>
        </div>

        <div class="metric-data">
            <span class="label">Hábitos Ativos</span>
            <div class="value" id="metric-total">0</div>
        </div>
    </div>

    <div class="metric-card">
        <div class="metric-icon">
            <i class="fa-solid fa-calendar-check"></i>
        </div>

        <div class="metric-data">
            <span class="label">Registros Hoje</span>
            <div class="value" id="metric-today">0</div>
        </div>
    </div>

    <div class="metric-card">
        <div class="metric-icon">
            <i class="fa-solid fa-chart-line"></i>
        </div>

        <div class="metric-data">
            <span class="label">Média Conclusão</span>
            <div class="value" id="metric-rate">0%</div>
        </div>
    </div>

</section>
